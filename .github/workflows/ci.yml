name: Contracts and routing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify generated contracts
        run: |
          python scripts/build_schemas.py
          git diff --exit-code -- schemas
      - name: Run regression, routing, handoff and concurrency tests
        run: python -m unittest discover -s tests -v
      - name: Replay the documented synthetic example
        run: python -m cost_router route examples/request.json --at 2026-09-05T00:30:00Z
